[package]
name = "xgpui-isolated-native-consumer"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
gpui = { package = "xgpui", version = "=2.0.1" }
gpui_platform = { package = "xgpui-platform", version = "=2.0.1" }
gpui_apple = { package = "xgpui-apple", version = "=3.0.1" }
gpui_macos = { package = "xgpui-macos", version = "=3.0.1" }
gpui_macros = { package = "xgpui-macros", version = "=1.0.1" }
gpui_wgpu = { package = "xgpui-wgpu", version = "=2.0.1" }
xgpui-color = "=0.3.0"
xgpui-gamut = { version = "=0.3.1", features = ["instanced"] }
xgpui-media = "=0.5.1"
xgpui-parley = "=0.3.1"
xgpui-shader = { version = "=0.4.1", features = ["portable-shaders"] }
xgpui-svg = "=0.3.1"
