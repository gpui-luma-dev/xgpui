name: Publish documentation

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Check website
        run: python3 scripts/check_pages.py
      # Detect stale path-dependency lockfiles before compiling the packaging CLI.
      - name: Verify shared extension-lab dependency lockfile
        run: >-
          cargo metadata --locked --format-version 1
          --config .cargo/validation.toml
          --manifest-path apps/xgpui-ext-lab/Cargo.toml --no-default-features --features web
          --filter-platform wasm32-unknown-unknown > /dev/null
      - name: Install Wasm target and packaging tool
        run: |
          rustup target add wasm32-unknown-unknown
          cargo install wasm-bindgen-cli --version 0.2.129 --locked
      - name: Check browser color preview samples
        run: bash apps/xgpui-ext-lab/extensions-web/check-color.sh
      - name: Build browser extension demos
        run: bash apps/xgpui-ext-lab/extensions-web/build.sh --release
      - name: Build instanced shader WASM companion
        run: bash apps/xgpui-ext-lab/shader-examples/build.sh --release
      - name: Check browser demo bundles
        run: |
          test -f pages/examples/extensions/extensions_web_bg.wasm
          test -f pages/examples/extensions/build-id.txt
          test -f pages/examples/shaders/shader_examples_bg.wasm
      - uses: actions/upload-pages-artifact@v3
        with:
          path: pages

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
