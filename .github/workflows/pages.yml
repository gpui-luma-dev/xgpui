name: Publish documentation

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Build and verify website
        run: |
          cargo run --locked --manifest-path tools/crate-roadmap/Cargo.toml
          node docs/verify.mjs
          node apps/web-support/graphics.test.mjs
      # Detect stale path-dependency lockfiles before compiling the packaging CLI.
      - name: Verify shared extension-lab dependency lockfile
        run: >-
          cargo metadata --locked --format-version 1
          --config .cargo/validation.toml
          --manifest-path apps/xgpui-ext-lab/Cargo.toml --no-default-features --features web
          --filter-platform wasm32-unknown-unknown > /dev/null
      - name: Install Wasm target and packaging tool
        run: |
          rustup target add wasm32-unknown-unknown
          cargo install wasm-bindgen-cli --version 0.2.129 --locked
      - name: Check browser color preview samples
        run: bash apps/xgpui-ext-lab/extensions-web/check-color.sh
      - name: Build browser extension demos
        run: |
          bash apps/xgpui-ext-lab/extensions-web/build.sh --release
          mkdir -p docs/examples/extensions
          cp apps/xgpui-ext-lab/extensions-web/dist/* docs/examples/extensions/
      - name: Build instanced shader WASM companion
        run: bash apps/xgpui-ext-lab/shader-examples/build.sh --release
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
