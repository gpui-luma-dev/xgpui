name: Paints linux-vulkan

on:
  workflow_dispatch:
    inputs:
      scope:
        description: Full acceptance or focused diagnostic
        type: choice
        options: [full, producer-cache, paint-parity]
        default: full
      cache:
        description: Use cold then warm on the same SHA to compare timings
        type: choice
        options: [warm, cold]
        default: warm
  pull_request:
    paths:
      - '.github/workflows/paints-*.yml'
      - '.github/workflows/portable-paints.yml'
      - '.github/paints/**'
      - '.cargo/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'gpui/crates/**'
      - 'extensions/crates/**'
      - 'apps/xgpui-ext-lab/paint-lab/**'
      - 'apps/xgpui-ext-lab/Cargo.*'

permissions:
  contents: read

jobs:
  validate:
    uses: ./.github/workflows/paints-backend.yml
    with:
      backend: linux-vulkan
      scope: ${{ inputs.scope || 'full' }}
      cache: ${{ inputs.cache || 'warm' }}
