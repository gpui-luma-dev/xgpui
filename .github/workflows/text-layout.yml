name: Text layout

# Native text-backend tests that macOS runs cannot cover: DirectWrite shaping,
# tab advances and caret mapping use the runner's real Consolas and Segoe UI.
# Core wrapping and CoreText tests run in `just test` on macOS.
on:
  workflow_dispatch:
  pull_request:
    branches: [main, 'issue-284/epic']
    paths:
      - '.github/workflows/text-layout.yml'
      - 'gpui/crates/gpui/src/text_system/**'
      - 'gpui/crates/gpui-windows/src/direct_write.rs'
      - 'gpui/crates/gpui-windows/Cargo.toml'
      - 'gpui/crates/gpui/Cargo.toml'
      - 'Cargo.lock'
  push:
    branches: [main, 'issue-284/epic']
    paths:
      - '.github/workflows/text-layout.yml'
      - 'gpui/crates/gpui/src/text_system/**'
      - 'gpui/crates/gpui-windows/src/direct_write.rs'
      - 'gpui/crates/gpui-windows/Cargo.toml'
      - 'gpui/crates/gpui/Cargo.toml'
      - 'Cargo.lock'

permissions:
  contents: read

concurrency:
  group: text-layout-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'
  RUST_BACKTRACE: '1'

jobs:
  direct-write:
    name: DirectWrite (windows-latest)
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: text-layout-v1
      - name: Test DirectWrite shaping, tabs and caret mapping
        run: "cargo test --locked --config .cargo/validation.toml -p xgpui-windows --features test-support --lib direct_write:: -- --test-threads=1"
      - name: Test core line wrapping and layout
        if: ${{ !cancelled() }}
        run: "cargo test --locked --config .cargo/validation.toml -p xgpui --features test-support --lib text_system::"
