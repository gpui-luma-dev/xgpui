name: Prepare registry release

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Leave blank for offline preparation; approved upload: publish six extensions 0.2.0 only"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: prepare-registry-release
  cancel-in-progress: false

jobs:
  plan:
    if: inputs.confirmation == ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Test release tooling
        run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: Prepare framework-first release inventory
        run: python3 scripts/prepare_registry_release.py --out "$RUNNER_TEMP/registry-release"
      - uses: actions/upload-artifact@v4
        with:
          name: registry-release-plan
          path: ${{ runner.temp }}/registry-release/release-plan.json
          if-no-files-found: error
          retention-days: 30
  extensions:
    if: inputs.confirmation == 'publish six extensions 0.2.0 only'
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 6dd303959ab4d16e9669da96a985692afd67606e
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Test publication safeguards
        run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: Verify and publish six approved extensions
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: >-
          python3 scripts/publish_extensions.py
          --out "$RUNNER_TEMP/extension-release"
          --publish --confirmation 'publish six extensions 0.2.0 only'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: extension-release-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/extension-release/report.json
            ${{ runner.temp }}/extension-release/*.log
            ${{ runner.temp }}/extension-release/target/package/**/*.crate
          if-no-files-found: error
          retention-days: 30
