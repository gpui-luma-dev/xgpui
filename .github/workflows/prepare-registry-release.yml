name: Prepare registry release

on:
  pull_request:
    paths:
      - '.github/workflows/prepare-registry-release.yml'
      - 'tools/release-sync/**'
      - 'scripts/test_all.sh'
      - 'justfile'
      - '.github/workflows/prepare-daily-release.yml'
      - 'scripts/release-packages.json'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Plan checks archives/registry; dry-run verifies available dependency roots; publish uploads missing versions'
        type: choice
        options: [plan, dry-run, publish]
        default: plan
      confirmation:
        description: 'Publish only: enter publish FULL_COMMIT_SHA for the selected branch commit'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: registry-release
  cancel-in-progress: false

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Test release tooling
        run: cargo test --locked --manifest-path tools/release-sync/Cargo.toml
  release:
    if: github.event_name == 'workflow_dispatch'
    needs: tests
    runs-on: macos-latest
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Plan or verify without upload credentials
        if: inputs.mode != 'publish'
        env:
          RELEASE_MODE: ${{ inputs.mode }}
        run: >-
          cargo run --locked --manifest-path tools/release-sync/Cargo.toml -- registry-release
          --out "$RUNNER_TEMP/registry-release" --mode "$RELEASE_MODE"
      - name: Publish explicitly confirmed commit
        if: inputs.mode == 'publish'
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          RELEASE_CONFIRMATION: ${{ inputs.confirmation }}
        run: >-
          cargo run --locked --manifest-path tools/release-sync/Cargo.toml -- registry-release
          --out "$RUNNER_TEMP/registry-release" --mode publish
          --confirmation "$RELEASE_CONFIRMATION"
      - name: Mark the verified release
        if: inputs.mode == 'publish'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_REPOSITORY: ${{ github.repository }}
        run: >-
          cargo run --locked --manifest-path tools/release-sync/Cargo.toml -- daily finalize
          --report "$RUNNER_TEMP/registry-release/report.json"
          --repo "$RELEASE_REPOSITORY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: registry-release-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/registry-release/report.json
            ${{ runner.temp }}/registry-release/*.log
            ${{ runner.temp }}/registry-release/prepared/*.crate
          if-no-files-found: warn
          retention-days: 30
