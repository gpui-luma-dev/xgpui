name: Validate xgpui

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      source_ref:
        description: Optional source ref to test using this workflow's validation configuration
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  importer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test import replacement and provenance
        run: python3 -m unittest discover -s scripts -p 'test_*.py' -v

      - name: Test downstream normalization and native manifest generation
        run: cargo test --locked --manifest-path tools/release-sync/Cargo.toml
      - name: Check normalized capture and generated manifests
        run: |
          cargo run --locked --manifest-path tools/release-sync/Cargo.toml -- normalize --check
          cargo run --locked --manifest-path tools/release-sync/Cargo.toml -- build-manifests --check
      - name: Build and verify documentation
        run: |
          cargo run --locked --manifest-path tools/crate-roadmap/Cargo.toml
          node docs/roadmap/verify.mjs

  native-build:
    # A manually selected clean upstream branch has no development build harness.
    if: inputs.source_ref == ''
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust tools
        run: rustup toolchain install stable --profile minimal --component clippy,rustfmt
      - name: Build every native library, including Metal shaders
        run: cargo +stable build --workspace --locked
      - name: Check build harness formatting
        run: cargo +stable fmt --package xgpui-build --check
      - name: Clippy
        run: cargo +stable clippy --workspace --locked
      - name: Compile captured examples without launching them
        run: cargo +stable build --config .cargo/validation.toml --manifest-path gpui/crates/gpui/Cargo.toml --examples --features gpui_platform/font-kit --target-dir target

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare validation configuration and source
        id: source
        env:
          SOURCE_REF: ${{ inputs.source_ref }}
        shell: bash
        run: |
          set -euo pipefail
          # Preserve this workflow's configuration when testing an older source branch.
          cp .cargo/validation.toml "$RUNNER_TEMP/xgpui-validation.toml"
          if [[ -n "$SOURCE_REF" ]]; then
            git fetch -- origin "$SOURCE_REF"
            git checkout --detach FETCH_HEAD
          fi
          if [[ -f gpui/crates/gpui-platform/Cargo.toml ]]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
            echo "platform=gpui/crates/gpui-platform/Cargo.toml" >> "$GITHUB_OUTPUT"
            echo "core=gpui/crates/gpui/Cargo.toml" >> "$GITHUB_OUTPUT"
          elif [[ -f gpui/crates/gpui-platform-gpui-unofficial/Cargo.toml ]]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
            echo "platform=gpui/crates/gpui-platform-gpui-unofficial/Cargo.toml" >> "$GITHUB_OUTPUT"
            echo "core=gpui/crates/gpui-unofficial/Cargo.toml" >> "$GITHUB_OUTPUT"
          else
            echo "No release has been imported on this branch yet."
          fi

      - name: Install Rust tools
        if: steps.source.outputs.present == 'true'
        run: rustup toolchain install stable --profile minimal --component clippy,rustfmt

      - name: Resolve platform dependencies and verify local sources
        if: steps.source.outputs.present == 'true'
        shell: bash
        run: |
          set -euo pipefail
          manifest="${{ steps.source.outputs.platform }}"
          config="$RUNNER_TEMP/xgpui-validation.toml"
          # Resolve a fresh lockfile with the reviewed compatibility override.
          cargo +stable --config "$config" generate-lockfile --manifest-path "$manifest"
          cargo +stable --config "$config" metadata --locked --manifest-path "$manifest" --format-version 1 \
            > "$RUNNER_TEMP/metadata.json"
          python3 scripts/check_local_dependencies.py "$RUNNER_TEMP/metadata.json"

      - name: Check platform build
        if: steps.source.outputs.present == 'true'
        run: cargo +stable --config "$RUNNER_TEMP/xgpui-validation.toml" check --locked --manifest-path "${{ steps.source.outputs.platform }}" --features font-kit,runtime_shaders

      - name: Clippy
        if: steps.source.outputs.present == 'true'
        run: cargo +stable clippy --config "$RUNNER_TEMP/xgpui-validation.toml" --locked --manifest-path "${{ steps.source.outputs.platform }}" --features font-kit,runtime_shaders

      - name: Library tests with Zed's Proptest revision
        if: steps.source.outputs.present == 'true'
        shell: bash
        run: |
          set -euo pipefail
          manifest="${{ steps.source.outputs.core }}"
          config="$RUNNER_TEMP/xgpui-validation.toml"
          cargo +stable --config "$config" generate-lockfile --manifest-path "$manifest"
          cargo +stable --config "$config" metadata --locked --manifest-path "$manifest" --format-version 1 \
            > "$RUNNER_TEMP/test-metadata.json"
          python3 scripts/check_local_dependencies.py "$RUNNER_TEMP/test-metadata.json"
          python3 - "$RUNNER_TEMP/test-metadata.json" "$config" <<'PY'
          import json, pathlib, sys, tomllib
          metadata = json.loads(pathlib.Path(sys.argv[1]).read_text())
          pin = tomllib.loads(pathlib.Path(sys.argv[2]).read_text())["patch"]["crates-io"]["proptest"]
          expected_source = f"git+{pin['git']}?rev={pin['rev']}#{pin['rev']}"
          packages = [p for p in metadata["packages"] if p["name"] in {"proptest", "proptest-macro"}]
          assert {p["name"] for p in packages} == {"proptest", "proptest-macro"}, "Missing property-test dependencies"
          assert all(p["source"] == expected_source for p in packages), "Proptest revision drifted"
          print("Verified Zed's exact Proptest and macro revision.")
          PY
          cargo +stable --config "$config" test --locked --manifest-path "$manifest" --lib --features gpui_platform/runtime_shaders
