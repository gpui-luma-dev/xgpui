name: Validate repository tooling

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  importer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test import replacement and provenance
        run: python3 -m unittest discover -s scripts -p 'test_*.py' -v

      - name: Test downstream normalization and native manifest generation
        run: cargo test --locked --manifest-path tools/release-sync/Cargo.toml
      - name: Check normalized capture and generated manifests
        run: |
          cargo run --locked --manifest-path tools/release-sync/Cargo.toml -- normalize --check
          cargo run --locked --manifest-path tools/release-sync/Cargo.toml -- build-manifests --check
      - name: Build and verify documentation
        run: |
          cargo run --locked --manifest-path tools/crate-roadmap/Cargo.toml
          node docs/verify.mjs

  native-libraries:
    name: Native libraries (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux development libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake pkg-config libfontconfig1-dev libfreetype6-dev libwayland-dev libxkbcommon-dev libxkbcommon-x11-dev libx11-xcb-dev libxcb-shape0-dev libxcb-xfixes0-dev libxrandr-dev libxi-dev libxcursor-dev libxinerama-dev libasound2-dev libudev-dev libvulkan-dev
      - name: Check all retained native libraries
        run: cargo check --locked --features full-capture,runtime-shaders
      - name: Check media without optional GPU backends
        if: runner.os == 'Linux'
        run: cargo check --locked --manifest-path extensions/crates/xgpui-media/Cargo.toml --no-default-features --lib
      - name: Test Cosmic inspection and Parley font controls on Linux
        if: runner.os == 'Linux'
        env:
          RUST_BACKTRACE: 1
        run: |
          cargo test --locked --config .cargo/validation.toml --manifest-path gpui/crates/gpui-wgpu/Cargo.toml --lib cosmic_text_system::tests
          cargo test --locked --config .cargo/validation.toml --manifest-path extensions/crates/xgpui-parley/Cargo.toml --lib --features native-test,gpui-platform/wayland,gpui-platform/x11
          cargo test --locked --config .cargo/validation.toml --manifest-path extensions/crates/xgpui-parley/Cargo.toml --test construction --features native-test,gpui-platform/wayland,gpui-platform/x11
          cargo test --locked --config .cargo/validation.toml --manifest-path apps/xgpui-ext-lab/Cargo.toml --bin text-lab --features runtime-shaders axes::tests
      - name: Verify local framework and registry helper identities
        shell: bash
        run: |
          cargo metadata --locked --format-version 1 > "$RUNNER_TEMP/xgpui-metadata.json"
          python scripts/check_local_dependencies.py "$RUNNER_TEMP/xgpui-metadata.json"
      - name: Check benchmark support and all platform benchmarks
        run: cargo check --locked --manifest-path gpui/crates/gpui-platform/Cargo.toml --config .cargo/validation.toml --features bench-support,test-support,runtime_shaders --benches
      - name: Test benchmark metrics and application context
        shell: bash
        env:
          # Avoid Criterion's fallback cargo metadata invocation, which does not
          # inherit the explicit compatibility configuration from cargo test.
          CRITERION_HOME: ${{ runner.temp }}/criterion-tests
        run: |
          # Benchmark collectors share process-wide tracing and allocator state.
          cargo test --locked --manifest-path gpui/crates/gpui/Cargo.toml --config .cargo/validation.toml --features bench-support,test-support,gpui_platform/runtime_shaders --lib bench_metrics:: -- --test-threads=1
          cargo test --locked --manifest-path gpui/crates/gpui/Cargo.toml --config .cargo/validation.toml --features bench-support,test-support,gpui_platform/runtime_shaders --lib app::bench_context:: -- --test-threads=1

  ios-compile:
    name: Experimental iOS simulator compile
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios-sim
      - uses: Swatinem/rust-cache@v2
      - name: Check retained iOS libraries
        run: cargo check --locked --features full-capture,runtime-shaders --target aarch64-apple-ios-sim
      - name: Build the simulator example bundle
        run: bash gpui/crates/gpui-ios/examples/ios/build-simulator.sh --locked
      - name: Compile native text input protocol tests
        run: cargo test --locked --manifest-path gpui/crates/gpui-ios/Cargo.toml --features runtime_shaders --target aarch64-apple-ios-sim --test text_input --no-run

  shader-wasm:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Install WASM packaging tool
        run: cargo install wasm-bindgen-cli --version 0.2.129 --locked
      - name: Build all six browser shader examples
        run: bash apps/xgpui-ext-lab/shader-examples/build.sh --release
      - uses: actions/upload-artifact@v4
        with:
          name: shader-examples-wasm
          path: target/web/shaders/
          if-no-files-found: error
          retention-days: 14
