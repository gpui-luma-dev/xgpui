name: Portable paint GPU checks (all backends)

on:
  workflow_dispatch:
    inputs:
      cache:
        description: Cache mode for every backend
        type: choice
        options: [warm, cold]
        default: warm

permissions:
  contents: read

jobs:
  windows-native:
    uses: ./.github/workflows/paints-backend.yml
    with:
      backend: windows-native
      scope: full
      cache: ${{ inputs.cache }}
  windows-wgpu:
    uses: ./.github/workflows/paints-backend.yml
    with:
      backend: windows-wgpu
      scope: full
      cache: ${{ inputs.cache }}
  linux-vulkan:
    uses: ./.github/workflows/paints-backend.yml
    with:
      backend: linux-vulkan
      scope: full
      cache: ${{ inputs.cache }}
