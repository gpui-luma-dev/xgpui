name: Portable paint GPU checks

# Explicit platform checks; does not claim native GPUI DirectX 11 integration.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  vulkan:
    runs-on: ubuntu-latest
    env:
      WGPU_BACKEND: vulkan
      XDG_RUNTIME_DIR: /tmp/xgpui-runtime
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install native dependencies and Mesa Vulkan
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake pkg-config libfontconfig1-dev libfreetype6-dev libwayland-dev libxkbcommon-dev libxkbcommon-x11-dev libx11-xcb-dev libxcb-shape0-dev libxcb-xfixes0-dev libxrandr-dev libxi-dev libxcursor-dev libxinerama-dev libasound2-dev libudev-dev libvulkan-dev mesa-vulkan-drivers
          mkdir -p "$XDG_RUNTIME_DIR"
          chmod 700 "$XDG_RUNTIME_DIR"
      - name: Run Vulkan paint reference tests
        run: cargo test --locked --config .cargo/validation.toml --manifest-path apps/paint-lab/Cargo.toml --features wgpu,portable-shaders wgpu_extension_paints -- --nocapture

  windows-wgpu:
    runs-on: windows-latest
    env:
      WGPU_BACKEND: dx12
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Run DirectX 12 wgpu paint reference tests
        run: cargo test --locked --config .cargo/validation.toml --manifest-path apps/paint-lab/Cargo.toml --features wgpu,portable-shaders wgpu_extension_paints -- --nocapture
