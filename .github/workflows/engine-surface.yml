name: Engine surface compile checks

# Build-only coverage for xgpui-surface and its two labs (#227). Hosted
# runners have no usable GPU, so nothing here runs a surface: runtime checks on
# real hardware stay with the cross-platform test script. The one exception is
# the Windows headless retirement test (#199), which renders on WARP (software
# D3D11) and so runs on the hosted Windows runner.
on:
  workflow_dispatch:
  pull_request:
    branches: [main, 'issue-227/epic']
    paths:
      - '.github/workflows/engine-surface.yml'
      - 'extensions/crates/xgpui-surface/**'
      - 'apps/xgpui-ext-lab/engine-surface-lab/**'
      - 'apps/xgpui-ext-lab/gpu-canvas-workbench/**'
      - 'apps/xgpui-ext-lab/Cargo.toml'
      - 'gpui/crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.cargo/validation.toml'
      - 'rust-toolchain*'
  push:
    branches: [main, 'issue-227/epic']
    paths:
      - '.github/workflows/engine-surface.yml'
      - 'extensions/crates/xgpui-surface/**'
      - 'apps/xgpui-ext-lab/engine-surface-lab/**'
      - 'apps/xgpui-ext-lab/gpu-canvas-workbench/**'
      - 'apps/xgpui-ext-lab/Cargo.toml'
      - 'gpui/crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.cargo/validation.toml'
      - 'rust-toolchain*'

permissions:
  contents: read

concurrency:
  group: engine-surface-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'
  RUST_BACKTRACE: '1'

jobs:
  compile:
    name: Engine surface compile (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: engine-surface-v1
      - name: Install Linux development libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake pkg-config libfontconfig1-dev libfreetype6-dev libwayland-dev libxkbcommon-dev libxkbcommon-x11-dev libx11-xcb-dev libxcb-shape0-dev libxcb-xfixes0-dev libxrandr-dev libxi-dev libxcursor-dev libxinerama-dev libasound2-dev libudev-dev libvulkan-dev
      - name: Lint the crate without features (no engine adapter)
        run: cargo clippy --locked --config .cargo/validation.toml -p xgpui-surface --lib --tests --no-deps -- -D warnings
      - name: Lint the crate with the wgpu engine adapter
        # Keep reporting after an earlier failure, so one run shows every problem.
        if: ${{ !cancelled() }}
        run: cargo clippy --locked --config .cargo/validation.toml -p xgpui-surface --features wgpu --lib --tests --no-deps -- -D warnings
      - name: Lint both labs
        if: ${{ !cancelled() }}
        # --tests on the shared lab package selects unrelated lab binaries too.
        run: cargo clippy --locked --config .cargo/validation.toml --manifest-path apps/xgpui-ext-lab/Cargo.toml --bin engine-surface-lab --bin gpu-canvas-workbench --no-deps -- -D warnings
      - name: Build crate tests and labs without running them
        if: ${{ !cancelled() }}
        run: |
          cargo test --locked --config .cargo/validation.toml -p xgpui-surface --features wgpu --lib --no-run
          cargo build --locked --config .cargo/validation.toml --manifest-path apps/xgpui-ext-lab/Cargo.toml --bin engine-surface-lab --bin gpu-canvas-workbench
      - name: Run the headless D3D11 retirement test on WARP (#199)
        if: ${{ !cancelled() && runner.os == 'Windows' }}
        run: cargo test --locked --config .cargo/validation.toml -p xgpui-windows --features test-support --lib directx_renderer::headless_retirement_tests
      - name: Record validation boundaries
        if: ${{ !cancelled() }}
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'SUMMARY'
          ## Engine surface validation scope
          Compiles and lints xgpui-surface (with and without `wgpu`) and links
          its tests, engine-surface-lab and gpu-canvas-workbench. Hosted runners have
          no usable GPU, so no surface is created, shared, presented or recovered here.
          Runtime coverage needs real hardware (see #227's cross-platform test script).
          Exception: on Windows, the headless D3D11 retirement test (#199) runs on
          WARP, the software renderer, so it needs no GPU.
          SUMMARY
