name: Sync GPUI release

on:
  workflow_dispatch:
    inputs:
      release:
        description: gpui-unofficial release number without release/
        required: true
        default: "1.25.3"
        type: string
      expected_sha:
        description: Optional full source commit SHA to verify
        required: false
        default: ""
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sync-gpui
  cancel-in-progress: false

jobs:
  review:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Build normalization tool
        run: cargo build --locked --release --manifest-path tools/release-sync/Cargo.toml --target-dir "$RUNNER_TEMP/normalization-target"
      - name: Prepare release tree comparison
        env:
          RELEASE: ${{ inputs.release }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        shell: bash
        run: |
          set -euo pipefail
          args=(prepare --release "$RELEASE" --snapshot "$RUNNER_TEMP/incoming" --report "$RUNNER_TEMP/review.json"
            --normalizer "$RUNNER_TEMP/normalization-target/release/xgpui-release" --map scripts/crate-names.json)
          if [[ -n "$EXPECTED_SHA" ]]; then args+=(--expected-sha "$EXPECTED_SHA"); fi
          python3 scripts/release_review.py "${args[@]}"
          count="$(jq '[.entries[] | select(.retain_local != true)] | length' "$RUNNER_TEMP/review.json")"
          echo "REVIEW_COUNT=$count" >> "$GITHUB_ENV"
      - name: Collect exact Zed release context
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/release_context.py --report "$RUNNER_TEMP/review.json" --output "$RUNNER_TEMP/zed-context.md" --json-output "$RUNNER_TEMP/zed-context.json"
      - name: Create a fresh review branch and separate commits
        if: env.REVIEW_COUNT != '0'
        env:
          RELEASE: ${{ inputs.release }}
        shell: bash
        run: |
          set -euo pipefail
          # Fresh per-run branches: never update an existing PR or force-push.
          branch="sync/review/$RELEASE-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          git switch -c "$branch"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for kind in code cargo metadata; do
            python3 scripts/release_review.py "$kind" --snapshot "$RUNNER_TEMP/incoming" --report "$RUNNER_TEMP/review.json"
            git add --all -- gpui .cargo/config.toml upstream.json
            commit=""
            if ! git diff --cached --quiet; then
              git commit -m "Propose gpui-unofficial $RELEASE $kind differences for review"
              commit="$(git rev-parse HEAD)"
            fi
            echo "${kind^^}_COMMIT=$commit" >> "$GITHUB_ENV"
          done
          git push origin "HEAD:refs/heads/$branch"
          echo "REVIEW_BRANCH=$branch" >> "$GITHUB_ENV"
      - name: Describe unresolved differences
        if: env.REVIEW_COUNT != '0'
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os, pathlib
          report = json.loads((pathlib.Path(os.environ['RUNNER_TEMP']) / 'review.json').read_text())
          code = [e for e in report['entries'] if e['kind'] == 'code']
          cargo = [e for e in report['entries'] if e['kind'] == 'cargo']
          metadata = [e for e in report['entries'] if e['kind'] == 'metadata']
          lines = [f"Incoming gpui-unofficial {report['release']} tree proposal.",
                   f"Source commit: `{report['source_commit']}`.", "",
                   "Unintegrated proposal: complete incoming files, not resolved patches. main is unchanged.",
                   "Downstream overlaps require manual decisions before merging. No platform validation is performed.", "",
                   f"## Code differences ({len(code)})", ""]
          for entry in code:
              label = 'upstream changed' if entry['upstream_changed'] else 'upstream unchanged; downstream-only difference'
              if entry.get('retain_local'): label += '; RETAINED: not applied'
              elif entry['downstream_overlap']: label += '; MANUAL REVIEW: downstream differs'
              lines.append(f"- `{entry['path']}` — {entry['change']}; {label}")
          lines += ["", f"## Cargo versions and dependencies ({len(cargo)})", "",
                    "Separate commit: package versions and dependency requirements, excluding the removed staging mirror.", "",
                    f"## Generated metadata/artifacts ({len(metadata)})", "",
                    "Separate commit: generated READMEs, provenance and other retained capture metadata.", ""]
          for kind in ('CODE', 'CARGO', 'METADATA'):
              commit = os.environ.get(kind + '_COMMIT')
              if commit:
                  lines.append(f"- [{kind.lower()} commit](https://github.com/{os.environ['GITHUB_REPOSITORY']}/commit/{commit})")
          lines += ['', (pathlib.Path(os.environ['RUNNER_TEMP']) / 'zed-context.md').read_text()]
          (pathlib.Path(os.environ['RUNNER_TEMP']) / 'review-pr.md').write_text('\n'.join(lines) + '\n')
          PY
      - name: Create a new draft PR
        if: env.REVIEW_COUNT != '0'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE: ${{ inputs.release }}
        run: gh pr create --draft --base main --head "$REVIEW_BRANCH" --title "Review gpui-unofficial $RELEASE incoming differences" --body-file "$RUNNER_TEMP/review-pr.md"
      - name: Save detailed comparison
        uses: actions/upload-artifact@v4
        with:
          name: release-tree-comparison
          path: |
            ${{ runner.temp }}/review.json
            ${{ runner.temp }}/zed-context.md
            ${{ runner.temp }}/zed-context.json
