name: Sync GPUI release

on:
  workflow_dispatch:
    inputs:
      release:
        description: Release number without the release/ prefix
        required: true
        default: "1.25.2"
        type: string
      expected_sha:
        description: Optional full source commit SHA to verify
        required: false
        default: ""
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sync-gpui
  cancel-in-progress: false

jobs:
  sync:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Import release onto upstream
        env:
          RELEASE: ${{ inputs.release }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        shell: bash
        run: |
          set -euo pipefail
          # Always use the importer from main, even if upstream has an older copy.
          cp scripts/import_release.py "$RUNNER_TEMP/import_release.py"
          git fetch origin upstream
          git switch -C upstream origin/upstream
          import_args=("$RELEASE")
          if [[ -n "$EXPECTED_SHA" ]]; then
            import_args+=(--expected-sha "$EXPECTED_SHA")
          fi
          python3 "$RUNNER_TEMP/import_release.py" "${import_args[@]}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all -- gpui .cargo/config.toml upstream.json
          if ! git diff --cached --quiet; then
            git commit -m "Import gpui-unofficial $RELEASE"
            git push origin upstream
          fi
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          import pathlib
          data = json.loads(pathlib.Path("upstream.json").read_text())
          print(f"Imported {data['ref']} at `{data['commit']}`.")
          print(f"Captured {len(data['packages'])} packages.")
          PY

      - name: Open or update sync PR
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE: ${{ inputs.release }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main upstream
          if git merge-base --is-ancestor origin/upstream origin/main; then
            echo "This import is already included in main."
            exit 0
          fi
          body_file="$RUNNER_TEMP/sync-pr.md"
          python3 - <<'PY' > "$body_file"
          import json
          import pathlib
          data = json.loads(pathlib.Path("upstream.json").read_text())
          print(f"Import gpui-unofficial `{data['ref']}`.")
          print(f"\nSource commit: `{data['commit']}`")
          print("\nCaptures the complete release tree under `gpui/`, preserving")
          print("source files and licenses. Generates local Cargo overrides")
          print("and records provenance in `upstream.json`.")
          print("\nReview validation results before merging. If there are conflicts,")
          print("resolve them on an integration branch created from main;")
          print("keep upstream free of local changes.")
          print("\n**Use a merge commit and keep the upstream branch.**")
          PY
          pr_number="$(gh pr list --base main --head upstream --state open \
            --json number --jq '.[0].number // empty')"
          if [[ -n "$pr_number" ]]; then
            gh pr edit "$pr_number" --title "Sync gpui-unofficial $RELEASE" \
              --body-file "$body_file"
          else
            gh pr create --base main --head upstream \
              --title "Sync gpui-unofficial $RELEASE" --body-file "$body_file"
          fi
