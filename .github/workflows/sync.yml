name: Sync GPUI release

on:
  workflow_dispatch:
    inputs:
      release:
        description: Release number without the release/ prefix
        required: true
        default: "1.25.2"
        type: string
      expected_sha:
        description: Optional full source commit SHA to verify
        required: false
        default: ""
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sync-gpui
  cancel-in-progress: false

jobs:
  sync:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Prepare downstream normalization tool
        run: |
          rustup toolchain install stable --profile minimal
          cargo +stable build --locked --release --manifest-path tools/release-sync/Cargo.toml --target-dir "$RUNNER_TEMP/normalization-target"
          cp "$RUNNER_TEMP/normalization-target/release/xgpui-release" "$RUNNER_TEMP/xgpui-release"
          cp scripts/crate-names.json "$RUNNER_TEMP/crate-names.json"
          cp scripts/import_release.py "$RUNNER_TEMP/import_release.py"

      - name: Select release branch
        env:
          RELEASE: ${{ inputs.release }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Invalid release"; exit 1; }
          branch="release/$RELEASE"
          git check-ref-format --branch "$branch"
          # The prior imported release is the baseline, not patched main.
          previous_ref="$(jq -r '.ref' upstream.json)"
          previous_sha="$(jq -r '.commit' upstream.json)"
          if [[ -n "$(git ls-remote --heads origin "refs/heads/$branch")" ]]; then
            git fetch origin "refs/heads/$branch"
            git switch -c "$branch" FETCH_HEAD
          else
            [[ "$previous_ref" =~ ^release/[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Invalid previous release"; exit 1; }
            if [[ -n "$(git ls-remote --heads origin "refs/heads/$previous_ref")" ]]; then
              git fetch origin "refs/heads/$previous_ref"
            else
              # One-time migration from the old normalized import history.
              git fetch origin refs/heads/upstream-normalized
            fi
            baseline_sha="$(git show FETCH_HEAD:upstream.json | jq -r '.commit')"
            [[ "$baseline_sha" == "$previous_sha" ]] || { echo "Import baseline differs from main's recorded source; review before syncing"; exit 1; }
            git switch -c "$branch" FETCH_HEAD
          fi
          # gpui-unofficial releases may be orphan snapshots; xgpui's import
          # branches must remain connected to main for a reviewable merge.
          git merge-base HEAD origin/main > /dev/null || { echo "Release branch has no shared xgpui history"; exit 1; }
          echo "SYNC_BRANCH=$branch" >> "$GITHUB_ENV"

      - name: Import and normalize release differences
        env:
          RELEASE: ${{ inputs.release }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        shell: bash
        run: |
          set -euo pipefail
          import_args=("$RELEASE")
          if [[ -n "$EXPECTED_SHA" ]]; then
            import_args+=(--expected-sha "$EXPECTED_SHA")
          fi
          python3 "$RUNNER_TEMP/import_release.py" "${import_args[@]}"
          "$RUNNER_TEMP/xgpui-release" normalize --root "$GITHUB_WORKSPACE" --map "$RUNNER_TEMP/crate-names.json"
          "$RUNNER_TEMP/xgpui-release" normalize --root "$GITHUB_WORKSPACE" --map "$RUNNER_TEMP/crate-names.json" --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all -- gpui .cargo/config.toml upstream.json
          if ! git diff --cached --quiet; then
            git commit -m "Sync gpui-unofficial $RELEASE"
            git push origin "HEAD:refs/heads/$SYNC_BRANCH"
          fi

      - name: Open or update release PR
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE: ${{ inputs.release }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          if git merge-base --is-ancestor HEAD origin/main || git diff --quiet origin/main...HEAD; then
            echo "No new release differences to integrate." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          body_file="$RUNNER_TEMP/sync-pr.md"
          source_sha="$(jq -r '.commit' upstream.json)"
          printf 'Sync gpui-unofficial release/%s into xgpui.\n\nSource commit: %s\nImport branch: %s\n\nIncludes release file differences with xgpui crate-name normalization. Review downstream conflicts and validate separately before manually merging. No automatic merge or platform validation is performed by sync.\n' "$RELEASE" "$source_sha" "$SYNC_BRANCH" > "$body_file"
          pr_number="$(gh pr list --base main --head "$SYNC_BRANCH" --state open \
            --json number --jq '.[0].number // empty')"
          if [[ -n "$pr_number" ]]; then
            gh pr edit "$pr_number" --title "Sync gpui-unofficial $RELEASE" \
              --body-file "$body_file"
          else
            gh pr create --draft --base main --head "$SYNC_BRANCH" \
              --title "Sync gpui-unofficial $RELEASE" --body-file "$body_file"
          fi
