[package]
name = "xgpui-parley"
version = "0.3.0"
edition = "2024"
publish = ["crates-io"]
repository = "https://github.com/gpui-luma-dev/xgpui"
description = "Experimental text extension for xgpui with Parley and HarfRust shaping and rasterization"
license = "Apache-2.0"
homepage = "https://xgpui.dev/"
documentation = "https://xgpui.dev/#parley-text"
readme = "README.md"
keywords = ["xgpui", "gpui", "text", "shaping", "parley"]
categories = ["gui", "text-processing"]

[workspace]

[features]
system-fonts = ["parley/system"]
native-test = ["dep:gpui-platform"]

[dependencies]
anyhow = "1"
gpui = { path = "../../../gpui/crates/gpui" , package = "xgpui", version = "=2.0.0" }
parley = { version = "=0.12.0", default-features = false, features = ["std", "complex-scripts"] }
skrifa = "=0.44.0"
tiny-skia = { version = "=0.12.0", default-features = false, features = ["std", "simd"] }
gpui-platform = { path = "../../../gpui/crates/gpui-platform", optional = true , package = "xgpui-platform", version = "=2.0.0" }

[[test]]
name = "construction"
harness = false
required-features = ["native-test"]

[dev-dependencies]
gpui = { path = "../../../gpui/crates/gpui", features = ["test-support"] , package = "xgpui", version = "=2.0.0" }
