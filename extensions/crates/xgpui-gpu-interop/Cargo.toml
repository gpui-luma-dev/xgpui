[package]
name = "xgpui-gpu-interop"
version = "0.1.0"
edition = "2024"
publish = ["crates-io"]
repository = "https://github.com/gpui-luma-dev/xgpui"
description = "Experimental zero-copy GPU interop for xgpui: show frames from your own GPU engine (wgpu or Metal) in xgpui windows"
license = "Apache-2.0"
readme = "README.md"
keywords = ["gpui", "gpu", "interop", "zero-copy", "wgpu"]
categories = ["gui", "graphics", "rendering"]

[features]
default = []
# Engine adapter for wgpu engines on their own device and queue. On Linux this
# is also the transport (opaque-fd Vulkan memory) and enables it in gpui-wgpu.
wgpu = ["dep:wgpu", "dep:gpui-wgpu", "dep:ash", "dep:gpui-windows", "dep:windows"]

[dependencies]
anyhow = "1"
gpui = { path = "../../../gpui/crates/gpui", package = "xgpui", version = "3.0.0" }

[target.'cfg(target_os = "macos")'.dependencies]
gpui-apple = { path = "../../../gpui/crates/gpui-apple", package = "xgpui-apple", version = "4.1.0" }
objc2 = "0.6"
objc2-core-foundation = { version = "=0.3.2", default-features = false, features = ["std", "CFBase", "CFDictionary", "CFNumber", "CFString"] }
objc2-io-surface = "0.3.2"
objc2-metal = { version = "0.3", features = ["objc2-io-surface"] }
wgpu = { version = "30.0.1", optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
gpui-wgpu = { path = "../../../gpui/crates/gpui-wgpu", package = "xgpui-wgpu", version = "2.3.0", features = ["external-memory"], optional = true }
ash = { version = "0.38", default-features = false, optional = true }

[target.'cfg(target_os = "linux")'.dev-dependencies]
gpui-wgpu = { path = "../../../gpui/crates/gpui-wgpu", package = "xgpui-wgpu", version = "2.3.0", features = ["external-memory", "test-support"] }

[target.'cfg(target_os = "windows")'.dependencies]
gpui-windows = { path = "../../../gpui/crates/gpui-windows", package = "xgpui-windows", version = "2.2.0", optional = true }
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Security", "Win32_Graphics_Direct3D11", "Win32_Graphics_Direct3D12", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common", "Win32_System_Threading"], optional = true }
wgpu = { version = "30.0.1", optional = true }

[target.'cfg(target_os = "windows")'.dev-dependencies]
gpui-windows = { path = "../../../gpui/crates/gpui-windows", package = "xgpui-windows", version = "2.2.0", features = ["test-support"] }

[target.'cfg(target_os = "macos")'.dev-dependencies]
gpui-apple = { path = "../../../gpui/crates/gpui-apple", features = ["test-support"], package = "xgpui-apple", version = "4.1.0" }
