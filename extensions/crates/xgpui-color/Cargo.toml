[package]
name = "xgpui-color"
version = "0.3.0"
edition = "2024"
publish = ["crates-io"]
description = "Color science extension for xgpui with standalone CPU conversions, gamut mapping, gradients, and WGSL math"
license = "Apache-2.0"
repository = "https://github.com/gpui-luma-dev/xgpui"
homepage = "https://xgpui.dev/"
documentation = "https://xgpui.dev/#color-math"
readme = "README.md"
keywords = ["xgpui", "color", "color-science", "gamut", "gradients"]
categories = ["graphics", "mathematics"]

[workspace]

[features]
default = []
icc = ["dep:moxcms"]

[dependencies]
moxcms = { version = "=0.8.1", optional = true, default-features = false }

[dev-dependencies]
naga = { version = "30.0.1", features = ["wgsl-in", "msl-out", "hlsl-out", "spv-out"] }

[target.'cfg(target_os = "macos")'.dev-dependencies]
objc2 = "0.6"
objc2-metal = "0.3"
objc2-foundation = "0.3.2"
