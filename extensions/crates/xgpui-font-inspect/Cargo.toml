[package]
name = "xgpui-font-inspect"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/gpui-luma-dev/xgpui"
description = "Internal OpenType inspection helpers for xgpui text backends"
readme = "README.md"
publish = ["crates-io"]

[workspace]

[lib]
name = "gpui_font_inspect"
path = "src/lib.rs"

[dependencies]
anyhow = "1"
gpui = { package = "xgpui", path = "../../../gpui/crates/gpui", version = "=2.0.1", default-features = false }

[dev-dependencies]
ttf-parser = "0.25"
