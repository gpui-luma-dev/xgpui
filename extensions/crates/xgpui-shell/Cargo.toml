[package]
name = "xgpui-shell"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Experimental desktop-aware window shell for XGPUI applications"
publish = false

[dependencies]
gpui = { package = "xgpui", path = "../../../gpui/crates/gpui", version = "=3.0.0" }
anyhow = "1"

[dev-dependencies]
gpui = { package = "xgpui", path = "../../../gpui/crates/gpui", version = "=3.0.0", features = ["test-support"] }
