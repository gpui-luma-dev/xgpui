[package]
name = "xgpui-canvas"
version = "0.2.0"
edition = "2024"
license = "Apache-2.0"
description = "Experimental spatial camera foundation for xgpui"
publish = false

[workspace]

[features]
gpui = ["dep:gpui", "dep:xgpui-shader", "dep:bytemuck", "dep:anyhow"]

[dependencies]
gpui = { package = "xgpui", path = "../../../gpui/crates/gpui", version = "=1.0.0", optional = true }
xgpui-shader = { path = "../xgpui-shader", version = "=0.2.0", features = ["portable-shaders"], optional = true }
bytemuck = { version = "1", features = ["derive"], optional = true }
anyhow = { version = "1", optional = true }
