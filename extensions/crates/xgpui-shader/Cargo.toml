[package]
name = "xgpui-shader"
version = "0.3.0"
edition = "2024"
publish = ["crates-io"]
repository = "https://github.com/gpui-luma-dev/xgpui"
description = "Shader and paint extension for xgpui with gradients, brushes, and portable WGSL shaders"
license = "Apache-2.0"
homepage = "https://xgpui.dev/"
documentation = "https://xgpui.dev/#extension-paints"
readme = "README.md"
keywords = ["xgpui", "gpui", "graphics", "wgsl", "shaders"]
categories = ["gui", "graphics"]

[workspace]

[features]
default = []
# Opt-in native/wgpu comparison tests; producers never select a backend here.
wgpu = []
portable-shaders = ["dep:naga", "dep:bytemuck"]

[dependencies]
unicode-segmentation = "1"
unicode-bidi = "0.3"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
naga = { version = "30.0.1", optional = true, features = ["wgsl-in", "msl-out", "spv-out", "hlsl-out"] }
bytemuck = { version = "1", optional = true, features = ["derive"] }
gpui = { path = "../../../gpui/crates/gpui" , package = "xgpui", version = "=1.2.0" }
refineable = { package = "refineable-gpui-unofficial", version = "=1.25.3" }

[dev-dependencies]
image = { version = "0.25.1", default-features = false }
gpui-wgpu = { path = "../../../gpui/crates/gpui-wgpu", features = ["test-support"] , package = "xgpui-wgpu", version = "=1.0.2" }
naga = { version = "30.0.1", features = ["wgsl-in", "spv-out", "hlsl-out"] }

[target.'cfg(target_os = "macos")'.dev-dependencies]
gpui-apple = { path = "../../../gpui/crates/gpui-apple", features = ["test-support", "font-kit"] , package = "xgpui-apple", version = "=2.0.1" }

[target.'cfg(target_os = "windows")'.dev-dependencies]
gpui-windows = { path = "../../../gpui/crates/gpui-windows", features = ["test-support"] , package = "xgpui-windows", version = "=1.0.2" }
