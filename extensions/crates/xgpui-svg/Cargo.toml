[package]
name = "xgpui-svg"
version = "0.2.2"
edition = "2024"
publish = ["crates-io"]
license = "Apache-2.0"
repository = "https://github.com/gpui-luma-dev/xgpui"
description = "Experimental SVG extension for xgpui with progressive elements and shared raster scheduling"
homepage = "https://xgpui.dev/"
documentation = "https://xgpui.dev/#svg-rendering"
readme = "README.md"
keywords = ["xgpui", "gpui", "gui", "svg", "graphics"]
categories = ["gui", "graphics", "multimedia::images"]

[workspace]

[dependencies]
anyhow = "1"
web-time = "1"
gpui = { path = "../../../gpui/crates/gpui" , package = "xgpui", version = "=1.1.1" }

[dev-dependencies]
gpui = { path = "../../../gpui/crates/gpui", features = ["test-support"] , package = "xgpui", version = "=1.1.1" }
