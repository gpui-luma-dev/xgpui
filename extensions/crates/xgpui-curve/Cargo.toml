[package]
name = "xgpui-curve"
version = "0.2.0"
edition = "2024"
publish = ["crates-io"]
description = "Curve and contour math for xgpui: geometry, arc length, plot series curves, functional curves, mesh lattices, curved field spines, node editing, strokes, and gpui paths"
license = "Apache-2.0"
repository = "https://github.com/gpui-luma-dev/xgpui"
homepage = "https://xgpui.dev/"
documentation = "https://xgpui.dev/curve.html"
readme = "README.md"
keywords = ["xgpui", "bezier", "curve", "spline", "geometry"]
categories = ["graphics", "mathematics"]

[features]
default = ["measure", "series", "func", "mesh", "spine", "node", "shape", "stroke", "fit", "svg-path", "gpui"]
measure = []
series = ["func"]
func = []
mesh = []
spine = ["measure"]
node = []
shape = []
stroke = ["measure"]
fit = []
svg-path = []
gpui = ["dep:gpui"]

[dependencies]
kurbo = "0.13.1"
gpui = { package = "xgpui", path = "../../../gpui/crates/gpui", version = "5.0.0", optional = true }

[dev-dependencies]
naga = { version = "30.0.1", features = ["wgsl-in", "msl-out", "hlsl-out", "spv-out"] }

[target.'cfg(target_os = "macos")'.dev-dependencies]
objc2 = "0.6"
objc2-metal = "0.3"
objc2-foundation = "0.3.2"
