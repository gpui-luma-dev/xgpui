[package]
name = "xgpui-shader"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[features]
default = []
wgpu = ["dep:gpui-wgpu", "dep:bytemuck"]
portable-shaders = ["dep:naga"]

[dependencies]
anyhow = "1"
naga = { version = "30.0.1", optional = true, features = ["wgsl-in", "msl-out", "spv-out", "hlsl-out"] }
gpui-wgpu = { path = "../../../../gpui/crates/gpui-wgpu", optional = true }
bytemuck = { version = "1", optional = true }
gpui = { path = "../../../../gpui/crates/gpui" }
refineable = { path = "../../../../gpui/crates/refineable" }

[target.'cfg(target_os = "macos")'.dependencies]
gpui-apple = { path = "../../../../gpui/crates/gpui-apple" }
metal = "0.33"

[dev-dependencies]
naga = { version = "30.0.1", features = ["wgsl-in", "spv-out", "hlsl-out"] }
