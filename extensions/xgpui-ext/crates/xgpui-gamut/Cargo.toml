[package]
name = "xgpui-gamut"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[features]
default = []
instanced = ["dep:xgpui-shader", "dep:bytemuck"]

[dependencies]
xgpui-shader = { path = "../xgpui-shader", features = ["portable-shaders"], optional = true }
bytemuck = { version = "1", features = ["derive"], optional = true }
xgpui-color = { path = "../xgpui-color" }
anyhow = "1"
gpui = { path = "../../../../gpui/crates/gpui" }

[target.'cfg(target_os = "macos")'.dependencies]
gpui-apple = { path = "../../../../gpui/crates/gpui-apple" }
metal = "0.33"

[target.'cfg(target_os = "windows")'.dependencies]
gpui-windows = { path = "../../../../gpui/crates/gpui-windows" }

[target.'cfg(target_os = "macos")'.dev-dependencies]
gpui-apple = { path = "../../../../gpui/crates/gpui-apple", features = ["test-support"] }
parking_lot = "0.12"

[dev-dependencies]
xgpui-shader = { path = "../xgpui-shader", features = ["portable-shaders"] }

[target.'cfg(target_os = "windows")'.dev-dependencies]
gpui-windows = { path = "../../../../gpui/crates/gpui-windows", features = ["test-support"] }
