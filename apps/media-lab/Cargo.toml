[package]
name = "media-lab"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
gpui = { path = "../../gpui/crates/gpui", features = ["test-support"] }
gpui_platform = { package = "gpui-platform", path = "../../gpui/crates/gpui-platform", default-features = false, features = ["test-support", "font-kit"] }
xgpui-media = { path = "../../extensions/xgpui-ext/crates/xgpui-media" }
xgpui-svg = { path = "../../extensions/xgpui-ext/crates/xgpui-svg" }
image = { version = "0.25.1", default-features = false, features = ["png", "jpeg", "webp"] }
tempfile = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
gpui-wgpu = { path = "../../gpui/crates/gpui-wgpu", features = ["test-support"], optional = true }

[features]
wgpu = ["dep:gpui-wgpu", "xgpui-media/wgpu"]
runtime-shaders = ["gpui_platform/runtime_shaders"]

[target.'cfg(any(target_os = "linux", target_os = "freebsd"))'.dependencies]
gpui_platform = { package = "gpui-platform", path = "../../gpui/crates/gpui-platform", default-features = false, features = ["test-support", "x11", "wayland"] }
xgpui-media = { path = "../../extensions/xgpui-ext/crates/xgpui-media", features = ["wgpu"] }

[target.'cfg(target_os = "macos")'.dependencies]
gpui-apple = { path = "../../gpui/crates/gpui-apple", features = ["test-support"] }
