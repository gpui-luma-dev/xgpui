[package]
name = "svg-lab"
version = "0.1.0"
edition = "2024"
publish = false
license = "Apache-2.0"

[workspace]

[dependencies]
anyhow = "1"
gpui = { path = "../../gpui/crates/gpui" }
gpui_platform = { package = "gpui-platform", path = "../../gpui/crates/gpui-platform", default-features = false, features = ["font-kit", "wayland", "x11"] }
clap = { version = "4", features = ["derive"] }
serde_json = "1"
sysinfo = { version = "=0.31.4", default-features = false, features = ["system"] }
libc = "0.2"
image = { version = "0.25", default-features = false, features = ["png"] }
xgpui-svg = { path = "../../extensions/xgpui-ext/crates/xgpui-svg" }
