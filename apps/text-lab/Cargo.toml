[package]
name = "text-lab"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
gpui = { path = "../../gpui/crates/gpui", features = ["profiler"] }
gpui_platform = { package = "gpui-platform", path = "../../gpui/crates/gpui-platform", default-features = false, features = ["font-kit", "wayland", "x11"] }
parley = { version = "=0.12.0", default-features = false, features = ["std", "complex-scripts"] }
skrifa = "=0.44.0"
xgpui-parley = { path = "../../extensions/xgpui-ext/crates/xgpui-parley", features = ["system-fonts"] }
unicode-segmentation = "1"
sysinfo = { version = "=0.31.4", default-features = false, features = ["system"] }

[target.'cfg(target_os = "macos")'.dev-dependencies]
core-foundation = "0.10"
core-text = "21"

[dev-dependencies]
gpui = { path = "../../gpui/crates/gpui", features = ["test-support"] }

[target.'cfg(target_os = "macos")'.dev-dependencies.gpui-apple]
path = "../../gpui/crates/gpui-apple"
features = ["font-kit"]
