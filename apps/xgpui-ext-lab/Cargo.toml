[package]
name = "xgpui-ext-lab"
version = "0.2.0"
edition = "2024"
license = "Apache-2.0"
description = "Native and browser labs and benchmarks for XGPUI extensions"
repository = "https://github.com/gpui-luma-dev/xgpui"
publish = false
autobins = false
autotests = false
autoexamples = false
autobenches = false
default-run = "shader-examples"

[lib]
path = "shared/lib.rs"

[features]
default = ["native"]
native = []
web = ["xgpui-color/icc"]
native-window-tests = ["native"]
linux-window-tests = ["native"]
# Real-window behavior probe for #284 package 06, run by the epic validation workflow.
macos-window-tests = ["native", "test-support"]
# Enable the tests in the shared GPUI input example reused by text-lab.
test-support = ["gpui/test-support"]
portable-shaders = ["xgpui-shader/portable-shaders"]
wgpu = ["xgpui-media/wgpu", "xgpui-shader/wgpu"]
runtime-shaders = ["gpui_platform/runtime_shaders"]

[dependencies]
xgpui-shell = { path = "../../extensions/crates/xgpui-shell" , package = "xgpui-shell", version = "0.1.0" }
xgpui-canvas = { path = "../../extensions/crates/xgpui-canvas", features = ["gpui"] , package = "xgpui-canvas", version = "0.3.2" }
anyhow = "1"
env_logger = "0.11"
gpui = { package = "xgpui", path = "../../gpui/crates/gpui", version = "3.0.0" }
xgpui-color = { path = "../../extensions/crates/xgpui-color", version = "0.3.1", package = "xgpui-color", features = ["icc"] }
xgpui-gamut = { path = "../../extensions/crates/xgpui-gamut", version = "0.3.2", features = ["instanced"] , package = "xgpui-gamut" }
xgpui-media = { path = "../../extensions/crates/xgpui-media", version = "0.5.2", package = "xgpui-media" }
xgpui-svg = { path = "../../extensions/crates/xgpui-svg", version = "0.3.2", package = "xgpui-svg" }
xgpui-parley = { path = "../../extensions/crates/xgpui-parley", version = "0.5.0", package = "xgpui-parley" }
xgpui-shader = { path = "../../extensions/crates/xgpui-shader", version = "0.4.2", features = ["portable-shaders", "wgpu"] , package = "xgpui-shader" }
gpui-wgpu = { package = "xgpui-wgpu", path = "../../gpui/crates/gpui-wgpu", version = "2.2.0" }
image = { version = "0.25.1", default-features = false, features = ["png", "jpeg", "webp"] }
parley = { version = "=0.12.0", default-features = false, features = ["std", "complex-scripts"] }
skrifa = "=0.44.0"
unicode-segmentation = "1"
web-time = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"

[dev-dependencies]
sha2 = "0.10"

[target.'cfg(not(target_family = "wasm"))'.dependencies]
clap = { version = "4", features = ["derive"] }
gpui = { package = "xgpui", path = "../../gpui/crates/gpui", version = "3.0.0", features = ["test-support", "profiler"] }
gpui_platform = { package = "xgpui-platform", path = "../../gpui/crates/gpui-platform", version = "2.0.2", default-features = false, features = ["test-support", "font-kit", "wayland", "x11"] }
gpui-wgpu = { package = "xgpui-wgpu", path = "../../gpui/crates/gpui-wgpu", version = "2.2.0", features = ["test-support"] }
xgpui-parley = { path = "../../extensions/crates/xgpui-parley", version = "0.5.0", features = ["system-fonts"] , package = "xgpui-parley" }
sysinfo = { version = "=0.31.4", default-features = false, features = ["system"] }
libc = "0.2"
tempfile = "3"

[target.'cfg(any(target_os = "linux", target_os = "freebsd"))'.dependencies]
xgpui-media = { path = "../../extensions/crates/xgpui-media", version = "0.5.2", features = ["wgpu"] , package = "xgpui-media" }

[target.'cfg(target_os = "linux")'.dependencies]
ash = { version = "0.38", default-features = false }

[target.'cfg(target_os = "windows")'.dependencies]
gpui-windows = { package = "xgpui-windows", path = "../../gpui/crates/gpui-windows", version = "2.1.0" }
windows = { version = "0.62", features = ["Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D11", "Win32_Graphics_Dxgi_Common"] }

[target.'cfg(target_os = "macos")'.dependencies]
gpui-apple = { package = "xgpui-apple", path = "../../gpui/crates/gpui-apple", version = "4.0.0", features = ["test-support", "font-kit"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["NSString"] }

objc2-core-foundation = { version = "=0.3.2", default-features = false, features = ["std", "CFDictionary", "CFBase"] }
objc2-core-video = { version = "=0.3.2", default-features = false, features = ["CVBase", "CVBuffer", "CVImageBuffer", "CVPixelBuffer", "CVReturn"] }

[target.'cfg(any(target_os = "macos", target_os = "linux", target_os = "windows"))'.dependencies]
xgpui-gpu-interop = { path = "../../extensions/crates/xgpui-gpu-interop", features = ["wgpu"] , package = "xgpui-gpu-interop", version = "0.1.0" }
futures = "0.3"

[target.'cfg(target_os = "macos")'.dev-dependencies]
core-foundation = "0.10"
core-text = "21"

[target.'cfg(target_family = "wasm")'.dependencies]
gpui-web = { package = "xgpui-web", path = "../../gpui/crates/gpui-web", version = "2.0.2", default-features = false }
xgpui-media = { path = "../../extensions/crates/xgpui-media", version = "0.5.2", features = ["wgpu"] , package = "xgpui-media" }
wasm-bindgen = "=0.2.129"
web-sys = { version = "0.3", features = ["Window", "Location", "console", "MediaQueryList"] }
console_error_panic_hook = "0.1"
wgpu = { version = "30.0.1", features = ["fragile-send-sync-non-atomic-wasm"] }

[[bin]]
name = "metal-producer-regression"
path = "metal-producer-regression/src/main.rs"
required-features = ["native"]

[[bin]]
name = "shell-lab"
path = "shell-lab/src/main.rs"
required-features = ["native"]

[[bin]]
name = "gpu-interop-lab"
path = "gpu-interop-lab/src/main.rs"
required-features = ["native"]

[[bin]]
name = "interop-boids"
path = "interop-boids/src/main.rs"
required-features = ["native"]

[[bin]]
name = "gpu-canvas-workbench"
path = "gpu-canvas-workbench/src/main.rs"
required-features = ["native"]

[[bin]]
name = "canvas-lab"
path = "canvas-lab/src/main.rs"
required-features = ["native"]

[[bin]]
name = "color-field-bench"
path = "color-field-bench/src/main.rs"
required-features = ["native"]

[[bin]]
name = "gamut-lab"
path = "gamut-lab/src/main.rs"
required-features = ["native"]

[[bin]]
name = "media-lab"
path = "media-lab/src/main.rs"
required-features = ["native"]

[[bin]]
name = "paint-lab"
path = "paint-lab/src/main.rs"
required-features = ["native"]

[[bin]]
name = "quad-bench"
path = "quad-bench/src/main.rs"
required-features = ["native"]

[[bin]]
name = "shader-examples"
path = "shader-examples/src/main.rs"

[[bin]]
name = "svg-lab"
path = "svg-lab/src/main.rs"
required-features = ["native"]

[[bin]]
name = "text-lab"
path = "text-lab/src/main.rs"
required-features = ["native"]

[[bin]]
name = "extensions-web"
path = "extensions-web/src/entry.rs"
required-features = ["web"]
test = false
bench = false

[[bin]]
name = "color-lab"
path = "color-lab/src/main.rs"
required-features = ["native"]

[[test]]
name = "compatibility"
path = "gamut-lab/tests/compatibility.rs"
required-features = ["native"]

[[test]]
name = "native_windows"
path = "gamut-lab/tests/native_windows.rs"
harness = false
required-features = ["native-window-tests"]

[[example]]
name = "native_variations"
path = "text-lab/examples/native_variations.rs"
required-features = ["native"]

[[test]]
name = "color-tasks"
path = "extensions-web/src/color_tasks_model.rs"
required-features = ["web"]

[[test]]
name = "italy-photo"
path = "extensions-web/src/italy.rs"
required-features = ["web"]

[[test]]
name = "linux_windows"
path = "tests/linux_windows.rs"
harness = false
required-features = ["linux-window-tests"]

[[test]]
name = "macos_frames"
path = "tests/macos_frames.rs"
harness = false
required-features = ["macos-window-tests"]
