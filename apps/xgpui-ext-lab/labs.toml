# Lab registry (#310): every lab binary and example in this package, with its
# views (named flag presets) and tasks (captures, benchmarks, platform tests).
#
#   just labs                     pick a lab, then a view or task, from a menu
#   just media                    open a lab
#   just media tiled --vivid      open a view, plus app arguments
#   just media capture            run a task
#   just labs check               registry matches Cargo.toml and the justfile (CI)
#
# Views and tasks share one namespace per lab: `just <lab> <name>`. Every lab
# also needs a one-line `<lab> *args:` recipe in the root justfile.
#
# Task kinds (exactly one per step):
#   args    = run this lab's binary with these arguments
#   cargo   = a cargo command; without --manifest-path it targets this package
#             and gets the default features, otherwise only the common flags
#   command = any program, run from the repository root
# "{args}" in a step marks where `-- extra args` go; otherwise they're appended
# to the last step. `mkdir` lists directories to create before a task runs.
# Every cargo invocation gets --locked, --config and --target-dir, and
# --profile unless the step sets its own (`just labs --profile dev …` overrides).

[defaults]
manifest = "apps/xgpui-ext-lab/Cargo.toml"
config = ".cargo/validation.toml"
target-dir = "target"
profile = "release"
features = ["runtime-shaders", "portable-shaders", "wgpu"]
# Other packages whose examples are registered here as tasks (checked).
example-packages = ["extensions/crates/xgpui-canvas"]

[[lab]]
name = "shell"
bin = "shell-lab"
group = "Main interactive labs"
title = "Shell / window controls"
about = "Desktop preference inspector and per-window shell override and state controls"

