[package]
name = "shader-examples"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
anyhow = "1"
gpui = { path = "../../gpui/crates/gpui" }
xgpui-shader = { path = "../../extensions/xgpui-ext/crates/xgpui-shader", features = ["portable-shaders", "wgpu"] }
web-time = "1"

[target.'cfg(target_family = "wasm")'.dependencies]
gpui-web = { path = "../../gpui/crates/gpui-web", default-features = false }
wasm-bindgen = "=0.2.129"
web-sys = { version = "0.3", features = ["Window", "Location", "console"] }
console_error_panic_hook = "0.1"
wgpu = { version = "30.0.1", features = ["fragile-send-sync-non-atomic-wasm"] }

[target.'cfg(not(target_family = "wasm"))'.dependencies]
gpui_platform = { package = "gpui-platform", path = "../../gpui/crates/gpui-platform", features = ["font-kit"] }
