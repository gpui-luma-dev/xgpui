[package]
name = "xgpui-macros"
version = "1.0.0"
edition = "2024"
license = "Apache-2.0"
description = "Procedural macros for xgpui actions, elements, and tests"
repository = "https://github.com/gpui-luma-dev/xgpui"
homepage = "https://xgpui.dev/"
documentation = "https://xgpui.dev/#crate=gpui-macros"
readme = "README.md"
keywords = ["xgpui", "gpui", "gui", "macros"]
categories = ["development-tools::procedural-macro-helpers"]

[features]

[lib]
path = "src/gpui_macros.rs"
proc-macro = true
doctest = true
test = false
name = "gpui_macros"

[dependencies]
heck = { version = "0.5" }
proc-macro2 = { version = "1.0.93" }
quote = { version = "1.0.9" }
syn = { version = "2.0", default-features = true, features = ["proc-macro", "full", "extra-traits", "visit-mut"] }

[dev-dependencies]

[workspace]
