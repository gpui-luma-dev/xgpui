[package]
name = "xgpui-platform"
version = "1.0.2"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/gpui-luma-dev/xgpui"
description = "Native and browser platform selection for xgpui"
homepage = "https://xgpui.dev/"
documentation = "https://xgpui.dev/#crate=gpui-platform"
readme = "README.md"
keywords = ["xgpui", "gpui", "gui", "desktop", "wasm"]
categories = ["gui"]

[lib]
path = "src/gpui_platform.rs"
doctest = false
name = "gpui_platform"

[features]
default = ["multithreaded"]
# Threads in the browser: needs a nightly toolchain and a cross-origin-isolated
# page. Off, gpui_web builds on stable.
multithreaded = ["gpui_web/multithreaded"]
bench-support = ["gpui_windows/test-support", "gpui/bench-support", "gpui_macos/bench-support", "gpui_wgpu/bench-support"]
font-kit = ["gpui_macos/font-kit"]
test-support = ["gpui/test-support", "gpui_macos/test-support", "gpui_windows/test-support", "gpui_wgpu/test-support"]
screen-capture = ["gpui/screen-capture", "gpui_macos/screen-capture", "gpui_windows/screen-capture", "gpui_linux/screen-capture"]
runtime_shaders = ["gpui_macos/runtime_shaders"]
wayland = ["gpui_linux/wayland"]
x11 = ["gpui_linux/x11"]

[[bench]]
name = "inspector_render"
harness = false
required-features = ["bench-support"]

[[bench]]
name = "randomized_element_tree"
harness = false
required-features = ["bench-support"]

[dependencies]
anyhow = { version = "1.0.86" }
gpui = { package = "xgpui", version = "=1.2.0" }

[dev-dependencies]
criterion = { version = "0.8.2", features = ["html_reports"] }

[target.'cfg(target_os = "macos")'.dependencies]
gpui_macos = { package = "xgpui-macos", version = "=2.0.1" }

[target.'cfg(target_os = "windows")'.dependencies]
gpui_windows = { package = "xgpui-windows", version = "=1.0.2" }
gpui = { package = "xgpui", version = "=1.2.0", features = ["windows-manifest"] }

[target.'cfg(any(target_os = "linux", target_os = "freebsd"))'.dependencies]
gpui_linux = { package = "xgpui-linux", version = "=1.0.2" }

[target.'cfg(target_os = "linux")'.dependencies]
gpui_wgpu = { package = "xgpui-wgpu", version = "=1.0.2", optional = true }

[target.'cfg(target_family = "wasm")'.dependencies]
gpui_web = { package = "xgpui-web", version = "=1.0.2" }
console_error_panic_hook = { version = "0.1.7" }

[workspace]
