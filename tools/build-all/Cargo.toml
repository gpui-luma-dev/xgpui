# Generated by xgpui-release build-manifests; do not edit.
[package]
name = "xgpui-build"
version = "0.0.0"
edition = "2024"
publish = false

[features]
runtime-shaders = [
    "gpui-platform/runtime_shaders",
    "gpui-apple?/runtime_shaders",
    "gpui-macos?/runtime_shaders",
]
full-capture = [
    "dep:gpui-apple",
    "dep:gpui-linux",
    "dep:gpui-macos",
    "dep:gpui-macros",
    "dep:gpui-web",
    "dep:gpui-wgpu",
    "dep:gpui-windows",
]

[dependencies]
gpui = { path = "../../gpui/crates/gpui", package = "xgpui-core" }
gpui-macros = { path = "../../gpui/crates/gpui-macros", package = "xgpui-macros", optional = true }
gpui-platform = { path = "../../gpui/crates/gpui-platform", package = "xgpui-platform" }
gpui-wgpu = { path = "../../gpui/crates/gpui-wgpu", package = "xgpui-wgpu", optional = true }

[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
gpui-apple = { path = "../../gpui/crates/gpui-apple", package = "xgpui-apple", optional = true }

[target.'cfg(any(target_os = "linux", target_os = "freebsd"))'.dependencies]
gpui-linux = { path = "../../gpui/crates/gpui-linux", package = "xgpui-linux", optional = true }
gpui-platform = { path = "../../gpui/crates/gpui-platform", features = ["wayland", "x11"], package = "xgpui-platform" }

[target.'cfg(target_os = "macos")'.dependencies]
gpui-macos = { path = "../../gpui/crates/gpui-macos", package = "xgpui-macos", optional = true }
gpui-platform = { path = "../../gpui/crates/gpui-platform", features = ["font-kit"], package = "xgpui-platform" }

[target.'cfg(target_family = "wasm")'.dependencies]
gpui-web = { path = "../../gpui/crates/gpui-web", package = "xgpui-web", optional = true }

[target.'cfg(target_os = "windows")'.dependencies]
gpui-windows = { path = "../../gpui/crates/gpui-windows", package = "xgpui-windows", optional = true }
